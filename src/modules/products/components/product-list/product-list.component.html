<!-- Update the page header section -->
<div class="page-header bg-primary text-white py-4 mb-4">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-8">
        <h1 class="display-5 fw-bold mb-2">Products</h1>

        <!-- Search results info -->
        <div
          *ngIf="getSearchInfo()"
          class="alert alert-info mb-2 p-2 d-flex align-items-center justify-content-between"
        >
          <div>
            <i class="fas fa-search me-2"></i>
            {{ getSearchInfo() }}
          </div>
          <button class="btn btn-sm btn-outline-info" (click)="clearSearch()">
            <i class="fas fa-times me-1"></i> Clear Search
          </button>
        </div>

        <p class="lead mb-0">
          {{ getActiveCategory() }} • {{ getProductCount() }} products found
        </p>
      </div>
      <div class="col-md-4 text-md-end">
        <button class="btn btn-light" (click)="showFilters = !showFilters">
          <i class="fas fa-filter me-2"></i>
          {{ showFilters ? "Hide" : "Show" }} Filters
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Main Content -->
<div class="container">
  <div class="row">
    <!-- Filters Sidebar -->
    <div class="col-lg-3" *ngIf="showFilters">
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-light">
          <h5 class="mb-0">
            <i class="fas fa-filter me-2"></i>
            Filters
          </h5>
        </div>
        <div class="card-body">
          <!-- In the filters card -->
          <div class="mb-4">
            <label class="form-label fw-bold">Search Products</label>
            <div class="input-group">
              <input
                type="text"
                class="form-control"
                placeholder="Search products..."
                [(ngModel)]="searchQuery"
                (keyup.enter)="onSearch()"
              />
              <button class="btn btn-primary" (click)="onSearch()">
                <i class="fas fa-search"></i>
              </button>
              <button
                *ngIf="searchQuery"
                class="btn btn-outline-secondary"
                (click)="clearSearch()"
              >
                <i class="fas fa-times"></i>
              </button>
            </div>
            <small class="form-text text-muted">
              Press Enter or click search icon
            </small>
          </div>

          <!-- Category Filter -->
          <div class="mb-4">
            <label class="form-label fw-bold">Category</label>
            <select
              class="form-select"
              [(ngModel)]="filters.category"
              (change)="applyFilters()"
            >
              <option value="">All Categories</option>
              <option
                *ngFor="let category of categories"
                [value]="category.slug"
              >
                {{ category.name }}
              </option>
            </select>
          </div>

          <!-- Price Range -->
          <div class="mb-4">
            <label class="form-label fw-bold">
              Price Range: ${{ filters.minPrice }} - ${{ filters.maxPrice }}
            </label>
            <div class="row">
              <div class="col-6">
                <input
                  type="number"
                  class="form-control"
                  placeholder="Min"
                  [(ngModel)]="filters.minPrice"
                  (change)="applyFilters()"
                  min="0"
                />
              </div>
              <div class="col-6">
                <input
                  type="number"
                  class="form-control"
                  placeholder="Max"
                  [(ngModel)]="filters.maxPrice"
                  (change)="applyFilters()"
                  min="0"
                />
              </div>
            </div>
            <input
              type="range"
              class="form-range mt-2"
              min="0"
              max="5000"
              step="100"
              [(ngModel)]="filters.maxPrice"
              (change)="applyFilters()"
            />
          </div>

          <!-- Rating Filter -->
          <div class="mb-4">
            <label class="form-label fw-bold">Minimum Rating</label>
            <div class="d-flex align-items-center">
              <div class="me-3">
                <div class="text-warning">
                  <i
                    *ngFor="let star of [1, 2, 3, 4, 5]"
                    class="fas fa-star"
                    [class.text-warning]="star <= (filters.rating ?? 0)"
                    [class.text-muted]="star > (filters.rating ?? 0)"
                    (click)="filters.rating = star; applyFilters()"
                  >
                  </i>
                </div>
              </div>
              <span class="text-muted">{{ filters.rating }}+ stars</span>
            </div>
          </div>

          <!-- Sort Options -->
          <div class="mb-4">
            <label class="form-label fw-bold">Sort By</label>
            <select
              class="form-select mb-2"
              [(ngModel)]="filters.sortBy"
              (change)="applyFilters()"
            >
              <option value="price">Price</option>
              <option value="rating">Rating</option>
              <option value="name">Name</option>
            </select>
            <div class="btn-group w-100">
              <button
                class="btn btn-outline-primary"
                [class.active]="filters.sortOrder === 'asc'"
                (click)="filters.sortOrder = 'asc'; applyFilters()"
              >
                <i class="fas fa-arrow-up"></i> Ascending
              </button>
              <button
                class="btn btn-outline-primary"
                [class.active]="filters.sortOrder === 'desc'"
                (click)="filters.sortOrder = 'desc'; applyFilters()"
              >
                <i class="fas fa-arrow-down"></i> Descending
              </button>
            </div>
          </div>

          <!-- Reset Filters -->
          <button class="btn btn-outline-danger w-100" (click)="resetFilters()">
            <i class="fas fa-redo me-2"></i>
            Reset Filters
          </button>
        </div>
      </div>
    </div>

    <!-- Products Grid -->
    <div [class]="showFilters ? 'col-lg-9' : 'col-12'">
      <!-- Loading State -->
      <div *ngIf="isLoading" class="text-center py-5">
        <app-loading-spinner
          message="Loading products..."
        ></app-loading-spinner>
      </div>

      <!-- No Products Found -->
      <div
        *ngIf="!isLoading && filteredProducts.length === 0"
        class="text-center py-5"
      >
        <div class="mb-4">
          <i class="fas fa-search fa-4x text-muted"></i>
        </div>
        <h3 class="text-muted">No products found</h3>
        <p class="text-muted mb-4">
          Try adjusting your filters or search terms
        </p>
        <button class="btn btn-primary" (click)="resetFilters()">
          <i class="fas fa-redo me-2"></i>
          Reset Filters
        </button>
      </div>

      <!-- Products Grid -->
      <div *ngIf="!isLoading && filteredProducts.length > 0" class="row">
        <!-- Results Info -->
        <div class="col-12 mb-4">
          <div class="d-flex justify-content-between align-items-center">
            <!-- In product-list.component.html -->
            <p class="mb-0">{{ displayRange }}</p>
            <div class="d-flex align-items-center">
              <span class="me-2">View:</span>
              <div class="btn-group">
                <button class="btn btn-outline-secondary active">
                  <i class="fas fa-th"></i>
                </button>
                <button class="btn btn-outline-secondary">
                  <i class="fas fa-list"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Product Cards -->
        <div
          class="col-lg-3 col-md-4 col-sm-6 mb-4"
          *ngFor="let product of paginatedProducts"
        >
          <app-product-card [product]="product"></app-product-card>
        </div>

        <!-- Pagination -->
        <div class="col-12 mt-4" *ngIf="totalPages > 1">
          <nav aria-label="Product pagination">
            <ul class="pagination justify-content-center">
              <!-- Previous Button -->
              <li class="page-item" [class.disabled]="currentPage === 1">
                <a
                  class="page-link"
                  (click)="changePage(currentPage - 1)"
                  aria-label="Previous"
                >
                  <span aria-hidden="true">&laquo;</span>
                </a>
              </li>

              <!-- Page Numbers -->
              <li
                *ngFor="let page of getPageNumbers()"
                class="page-item"
                [class.active]="page === currentPage"
              >
                <a class="page-link" (click)="changePage(page)">{{ page }}</a>
              </li>

              <!-- Next Button -->
              <li
                class="page-item"
                [class.disabled]="currentPage === totalPages"
              >
                <a
                  class="page-link"
                  (click)="changePage(currentPage + 1)"
                  aria-label="Next"
                >
                  <span aria-hidden="true">&raquo;</span>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </div>
</div>
