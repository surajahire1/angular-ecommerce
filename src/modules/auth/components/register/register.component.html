<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
          <!-- Logo -->
          <div class="text-center mb-4">
            <h2 class="text-primary fw-bold">
              <i class="fas fa-shopping-bag me-2"></i>
              ShopEZ
            </h2>
            <p class="text-muted">Create your account to start shopping</p>
          </div>

          <!-- Success Message -->
          <div *ngIf="successMessage" class="alert alert-success" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            {{ successMessage }}
          </div>

          <!-- Registration Form -->
          <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
            <!-- Name Row -->
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="firstName" class="form-label">First Name *</label>
                <input
                  type="text"
                  id="firstName"
                  name="firstName"
                  [(ngModel)]="userData.firstName"
                  class="form-control"
                  placeholder="Enter first name"
                  required
                  [disabled]="isLoading"
                >
              </div>
              <div class="col-md-6">
                <label for="lastName" class="form-label">Last Name *</label>
                <input
                  type="text"
                  id="lastName"
                  name="lastName"
                  [(ngModel)]="userData.lastName"
                  class="form-control"
                  placeholder="Enter last name"
                  required
                  [disabled]="isLoading"
                >
              </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email Address *</label>
              <input
                type="email"
                id="email"
                name="email"
                [(ngModel)]="userData.email"
                class="form-control"
                placeholder="Enter your email"
                required
                [disabled]="isLoading"
              >
            </div>

            <!-- Phone -->
            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                [(ngModel)]="userData.phone"
                class="form-control"
                placeholder="Enter your phone number"
                [disabled]="isLoading"
              >
            </div>

            <!-- Password -->
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="password" class="form-label">Password *</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  [(ngModel)]="userData.password"
                  class="form-control"
                  placeholder="Create password"
                  required
                  [disabled]="isLoading"
                >
                <small class="form-text text-muted">Minimum 6 characters</small>
              </div>
              <div class="col-md-6">
                <label for="confirmPassword" class="form-label">Confirm Password *</label>
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  [(ngModel)]="userData.confirmPassword"
                  class="form-control"
                  placeholder="Confirm password"
                  required
                  [disabled]="isLoading"
                >
              </div>
            </div>

            <!-- Terms Agreement -->
            <div class="mb-4">
              <div class="form-check">
                <input
                  type="checkbox"
                  id="agreeToTerms"
                  name="agreeToTerms"
                  [(ngModel)]="userData.agreeToTerms"
                  class="form-check-input"
                  required
                  [disabled]="isLoading"
                >
                <label for="agreeToTerms" class="form-check-label">
                  I agree to the
                  <a href="#" class="text-decoration-none">Terms of Service</a>
                  and
                  <a href="#" class="text-decoration-none">Privacy Policy</a>
                </label>
              </div>
            </div>

            <!-- Error Message -->
            <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
              <i class="fas fa-exclamation-circle me-2"></i>
              {{ errorMessage }}
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="btn btn-primary w-100 py-2"
              [disabled]="isLoading || !registerForm.valid"
            >
              <span *ngIf="!isLoading">
                <i class="fas fa-user-plus me-2"></i>
                Create Account
              </span>
              <span *ngIf="isLoading">
                <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                Creating Account...
              </span>
            </button>
          </form>

          <!-- Divider -->
          <div class="text-center my-4">
            <span class="text-muted">or sign up with</span>
          </div>

          <!-- Social Registration -->
          <div class="d-grid gap-2">
            <button class="btn btn-outline-secondary" type="button" disabled>
              <i class="fab fa-google me-2"></i>
              Continue with Google
            </button>
            <button class="btn btn-outline-secondary" type="button" disabled>
              <i class="fab fa-facebook me-2"></i>
              Continue with Facebook
            </button>
          </div>

          <!-- Login Link -->
          <div class="text-center mt-4">
            <p class="text-muted mb-0">
              Already have an account?
              <a routerLink="/auth/login" class="text-decoration-none fw-bold ms-1">
                Sign In
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
