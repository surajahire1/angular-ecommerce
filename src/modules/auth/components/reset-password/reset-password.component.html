<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
          <!-- Logo -->
          <div class="text-center mb-4">
            <h2 class="text-primary fw-bold">
              <i class="fas fa-shopping-bag me-2"></i>
              ShopEZ
            </h2>
            <p class="text-muted">Create new password</p>
          </div>

          <!-- Success Message -->
          <div *ngIf="isCompleted" class="text-center">
            <div class="alert alert-success" role="alert">
              <div class="mb-3">
                <i class="fas fa-check-circle fa-3x text-success"></i>
              </div>
              <h5 class="alert-heading">Password Reset Successful!</h5>
              <p class="mb-0">
                Your password has been successfully reset.
              </p>
              <p class="mt-3 small text-muted">
                You can now log in with your new password.
              </p>
            </div>
            <button class="btn btn-primary w-100 mt-3" (click)="goToLogin()">
              <i class="fas fa-sign-in-alt me-2"></i>
              Go to Login
            </button>
          </div>

          <!-- Reset Password Form -->
          <div *ngIf="!isCompleted">
            <p class="text-muted mb-4">
              Please enter your new password below.
            </p>

            <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
              <!-- New Password -->
              <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <input
                  type="password"
                  id="newPassword"
                  name="newPassword"
                  [(ngModel)]="passwordData.newPassword"
                  class="form-control"
                  placeholder="Enter new password"
                  required
                  [disabled]="isLoading"
                >
                <small class="form-text text-muted">Minimum 6 characters</small>
              </div>

              <!-- Confirm Password -->
              <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  [(ngModel)]="passwordData.confirmPassword"
                  class="form-control"
                  placeholder="Confirm new password"
                  required
                  [disabled]="isLoading"
                >
              </div>

              <!-- Error Message -->
              <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                {{ errorMessage }}
              </div>

              <!-- Submit Button -->
              <button
                type="submit"
                class="btn btn-primary w-100 py-2"
                [disabled]="isLoading || !resetForm.valid"
              >
                <span *ngIf="!isLoading">
                  <i class="fas fa-key me-2"></i>
                  Reset Password
                </span>
                <span *ngIf="isLoading">
                  <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                  Resetting...
                </span>
              </button>
            </form>

            <!-- Back to Login -->
            <div class="text-center mt-4">
              <a routerLink="/auth/login" class="text-decoration-none">
                <i class="fas fa-arrow-left me-1"></i>
                Back to Login
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
