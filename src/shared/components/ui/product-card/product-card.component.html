<div class="product-card card h-100 border-0 shadow-sm">
  <!-- Product Image -->
  <div class="product-image position-relative">
    <img
      [src]="product.thumbnail"
      [alt]="product.title"
      class="card-img-top"
    >
    <span *ngIf="product.discountPercentage > 0"
          class="badge bg-danger position-absolute top-0 end-0 m-2">
      -{{ product.discountPercentage }}%
    </span>
  </div>

  <!-- Card Body -->
  <div class="card-body d-flex flex-column">
    <!-- Category -->
    <div class="mb-2">
      <span class="badge bg-light text-dark">{{ product.category }}</span>
    </div>

    <!-- Title -->
    <h5 class="card-title text-truncate-2 mb-2">
      <a [routerLink]="['/products', product.id]" class="text-decoration-none text-dark">
        {{ product.title }}
      </a>
    </h5>

    <!-- Description -->
    <p class="card-text text-muted small mb-3 text-truncate-3">
      {{ product.description }}
    </p>

    <!-- Rating -->
    <div class="mb-3">
      <div class="d-flex align-items-center">
        <div class="text-warning me-2">
          <i *ngFor="let star of ratingArray" class="fas fa-star"></i>
          <i *ngIf="product.rating % 1 !== 0" class="fas fa-star-half-alt"></i>
        </div>
        <small class="text-muted">({{ product.rating }})</small>
      </div>
    </div>

    <!-- Price -->
    <div class="mt-auto">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h4 class="text-primary fw-bold mb-0">
            ${{ discountPrice | number:'1.2-2' }}
          </h4>
          <small *ngIf="product.discountPercentage > 0"
                 class="text-muted text-decoration-line-through">
            ${{ product.price | number:'1.2-2' }}
          </small>
        </div>
        <span class="badge bg-success">
          {{ product.stock }} in stock
        </span>
      </div>

      <!-- Actions -->
      <div *ngIf="showActions" class="d-grid gap-2">
        <button class="btn btn-primary" (click)="addToCart()">
          <i class="fas fa-cart-plus me-2"></i>
          Add to Cart
        </button>
        <a [routerLink]="['/products', product.id]" class="btn btn-outline-primary">
          <i class="fas fa-eye me-2"></i>
          View Details
        </a>
      </div>
    </div>
  </div>
</div>
